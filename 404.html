<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestion des plateaux</title>
  <script>
    /* Adresse inconnue (un club qui n'existe pas) : retour à la page
       d'accueil. Sur GitHub Pages, l'application est sous /feuille-match/. */
    var base = /\.github\.io$/.test(location.hostname) ? "/" + location.pathname.split("/")[1] + "/" : "/";
    location.replace(base + "?inconnu");
  </script>
</head>
<body>
  <p><a href="./">Page d'accueil</a></p>
</body>
</html>
