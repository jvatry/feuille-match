name = "feuille-match-relais"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
DEPOT = "jvatry/feuille-match"
BRANCHE = "main"
# Adresse(s) de l'application, séparées par des virgules (sans / final).
ORIGINES = "https://jvatry.github.io"

# Secrets, jamais dans ce fichier :
#   npx wrangler secret put GITHUB_TOKEN
#   et, pour chaque club et chacune de ses catégories :
#   npx wrangler secret put EMPREINTE_JETON_FCHETTANGE_U7
#   npx wrangler secret put EMPREINTE_JETON_FCHETTANGE_U9
#   npx wrangler secret put EMPREINTE_JETON_FCHETTANGE_U11
# Le relais écrit <club>/effectif-<u7|u9|u11>.enc.json, rien d'autre.
