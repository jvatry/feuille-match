name = "feuille-match-relais"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
DEPOT = "jvatry/feuille-match"
BRANCHE = "main"
# Adresse(s) de l'application, séparées par des virgules (sans / final).
ORIGINES = "https://jvatry.github.io"

# Secrets, jamais dans ce fichier :
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put EMPREINTE_JETON_U9
#   npx wrangler secret put EMPREINTE_JETON_U11
# Le relais écrit effectif-u9.enc.json ou effectif-u11.enc.json, rien d'autre.
